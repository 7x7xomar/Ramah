<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض السيراميك والبورسلين</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #1e293b;
            --accent-color: #25d366;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #334155;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 2rem 1rem;
            margin-bottom: 2rem;
            position: relative;
        }

        .admin-trigger {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .admin-trigger:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 3rem;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-slider {
            position: relative;
            width: 100%;
            height: 220px;
            background-color: #e2e8f0;
            overflow: hidden;
        }

        .card-slider img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .card-slider img.active {
            display: block;
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .prev-btn {
            right: 10px;
        }
        .next-btn {
            left: 10px;
        }

        .card-content {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        .product-price {
            font-size: 1.1rem;
            color: #0d9488;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .product-desc {
            font-size: 0.95rem;
            color: #64748b;
            margin-bottom: 1.2rem;
            flex-grow: 1;
        }

        .whatsapp-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .whatsapp-btn:hover {
            background-color: #128c7e;
        }

        /* لوحة التحكم */
        #admin-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .admin-content {
            background: white;
            width: 100%;
            max-width: 600px;
            border-radius: 12px;
            padding: 2rem;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .admin-content h2 {
            margin-bottom: 1rem;
            color: var(--primary-color);
        }
        .close-admin {
            position: absolute;
            top: 15px;
            left: 15px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #64748b;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
        }

        .admin-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        .admin-btn:hover {
            background-color: #334155;
        }

        .admin-products-list {
            margin-top: 1.5rem;
            border-top: 1px solid #e2e8f0;
            padding-top: 1rem;
        }

        .admin-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f5f9;
            padding: 0.6rem 1rem;
            border-radius: 6px;
            margin-bottom: 0.5rem;
        }

        .delete-btn {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background: #e2e8f0;
            color: #475569;
        }
    </style>
</head>
<body>
    <header>
        <button class="admin-trigger" onclick="openAdminPanel()">
            لوحة التحكم ⚙️
        </button>
        <div class="container">
            <h1>مؤسسة السيراميك العصرية</h1>
            <p>أرقى تشكيلات السيراميك والبورسلين والديكورات</p>
        </div>
    </header>

    <main class="container">
        <section>
            <div id="products-grid" class="products-grid"></div>
        </section>
    </main>

    <!-- نافذة لوحة التحكم -->
    <div id="admin-modal">
        <div class="admin-content">
            <button class="close-admin" onclick="closeAdminPanel()">&times;</button>
            <h2>إدارة المنتجات (سحابي)</h2>

            <form id="product-form" onsubmit="handleAddProduct(event)">
                <div class="form-group">
                    <label>اسم المنتج:</label>
                    <input type="text" id="p-name" required placeholder="مثال: سيراميك هندي لامع" />
                </div>
                <div class="form-group">
                    <label>السعر (ر.س):</label>
                    <input type="number" id="p-price" required placeholder="55" />
                </div>
                <div class="form-group">
                    <label>الوصف:</label>
                    <textarea id="p-desc" rows="2" placeholder="وصف المنتج ومميزاته..."></textarea>
                </div>
                <div class="form-group">
                    <label>اختر صور المنتج (يمكنك تحديد أكثر من صورة دفعة واحدة):</label>
                    <input type="file" id="p-images" accept="image/*" multiple required />
                    <small style="color: #64748b; display: block; margin-top: 4px;">اضغط على زر التحديد واختبر تحديد عدة صور بالماوس أو مفتاح Shift</small>
                </div>
                <button type="submit" class="admin-btn">حفظ في فايربيس ونشر المنتج</button>
            </form>

            <div class="admin-products-list">
                <h3>المنتجات المحفوظة في قاعدة البيانات</h3>
                <div id="admin-list-container"></div>
            </div>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026</p>
    </footer>

    <!-- ربط Firebase وتهيئة قاعدة البيانات Firestore -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const ADMIN_PASSWORD = "123"; 
        const PHONE_NUMBER = "966536980662";

        const firebaseConfig = {
            apiKey: "AIzaSyBGmQ79uC7Vy25Dvrza6LNwRnLCApZBHLU",
            authDomain: "ramah-6c086.firebaseapp.com",
            projectId: "ramah-6c086",
            storageBucket: "ramah-6c086.firebasestorage.app",
            messagingSenderId: "1021899751757",
            appId: "1:1021899751757:web:048e840f9e7aa12324f704",
            measurementId: "G-SS9S4TV4ZS"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function fetchProducts() {
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                const products = [];
                querySnapshot.forEach((docSnap) => {
                    products.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderProducts(products);
                renderAdminList(products);
            } catch (error) {
                console.error("خطأ في جلب البيانات:", error);
            }
        }

        function renderProducts(products) {
            const gridContainer = document.getElementById("products-grid");
            gridContainer.innerHTML = "";

            if (products.length === 0) {
                gridContainer.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:#64748b;">لا توجد منتجات مضافة حالياً في قاعدة البيانات.</p>`;
                return;
            }

            products.forEach((product, index) => {
                const card = document.createElement("div");
                card.className = "product-card";

                let imagesHTML = "";
                if (product.images && product.images.length > 0) {
                    product.images.forEach((imgUrl, imgIndex) => {
                        const activeClass = imgIndex === 0 ? "active" : "";
                        imagesHTML += `<img src="${imgUrl}" alt="${product.name}" class="${activeClass}">`;
                    });
                }

                let sliderControlsHTML = "";
                if (product.images && product.images.length > 1) {
                    sliderControlsHTML = `
                        <button class="slider-btn prev-btn" onclick="slideImage('${index}', 1)"><i class="fa-solid fa-chevron-right"></i></button>
                        <button class="slider-btn next-btn" onclick="slideImage('${index}', -1)"><i class="fa-solid fa-chevron-left"></i></button>
                    `;
                }

                const message = `مرحباً، أرغب في الاستفسار وطلب هذا المنتج:\n\n*المنتج:* ${product.name}\n*السعر:* ${product.price} ريال\n*الوصف:* ${product.description || ""}`;
                const whatsappLink = `https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent(message)}`;

                card.innerHTML = `
                    <div class="card-slider" id="slider-${index}">
                        ${imagesHTML}
                        ${sliderControlsHTML}
                    </div>
                    <div class="card-content">
                        <h3 class="product-title">${product.name}</h3>
                        <div class="product-price">${product.price} ر.س</div>
                        <p class="product-desc">${product.description || ""}</p>
                        <a href="${whatsappLink}" target="_blank" class="whatsapp-btn">
                            <i class="fa-brands fa-whatsapp"></i> طلب عبر الواتساب
                        </a>
                    </div>
                `;
                gridContainer.appendChild(card);
            });
        }

        function convertFileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = (error) => reject(error);
            });
        }

        // إضافة منتج جديد مع دعم صور متعددة
        window.handleAddProduct = async function(event) {
            event.preventDefault();

            const name = document.getElementById("p-name").value;
            const price = Number(document.getElementById("p-price").value);
            const description = document.getElementById("p-desc").value;
            const imageFiles = document.getElementById("p-images").files;

            if (imageFiles.length === 0) {
                alert("الرجاء اختيار صورة واحدة على الأقل!");
                return;
            }

            let images = [];
            try {
                // حلقة تكرارية لتحويل كل الصور المحددة إلى Base64
                for (let i = 0; i < imageFiles.length; i++) {
                    const base64Str = await convertFileToBase64(imageFiles[i]);
                    images.push(base64Str);
                }

                await addDoc(collection(db, "products"), {
                    name,
                    price,
                    description,
                    images,
                    createdAt: Date.now()
                });

                document.getElementById("product-form").reset();
                alert(`تم رفع (${images.length}) صور وحفظ المنتج بنجاح في قاعدة بيانات فايربيس!`);
                fetchProducts();
            } catch (error) {
                alert("حدث خطأ أثناء الحفظ: " + error.message);
            }
        };

        function renderAdminList(products) {
            const container = document.getElementById("admin-list-container");
            container.innerHTML = "";

            products.forEach((product) => {
                const item = document.createElement("div");
                item.className = "admin-item";
                const imgCount = product.images ? product.images.length : 0;
                item.innerHTML = `
                    <span><b>${product.name}</b> (${product.price} ر.س) - <i>${imgCount} صور</i></span>
                    <button class="delete-btn" onclick="deleteProduct('${product.id}')">حذف</button>
                `;
                container.appendChild(item);
            });
        }

        window.deleteProduct = async function(id) {
            if (confirm("هل أنت متأكد من حذف هذا المنتج من قاعدة البيانات؟")) {
                try {
                    await deleteDoc(doc(db, "products", id));
                    fetchProducts();
                } catch (error) {
                    alert("خطأ في الحذف: " + error.message);
                }
            }
        };

        window.slideImage = function(productIndex, direction) {
            const slider = document.getElementById(`slider-${productIndex}`);
            if (!slider) return;
            const images = slider.querySelectorAll("img");
            let activeIndex = Array.from(images).findIndex((img) => img.classList.contains("active"));
            if (activeIndex === -1) return;

            images[activeIndex].classList.remove("active");
            activeIndex = (activeIndex + direction + images.length) % images.length;
            images[activeIndex].classList.add("active");
        };

        window.openAdminPanel = function() {
            const pass = prompt("أدخل كلمة مرور لوحة التحكم:");
            if (pass === ADMIN_PASSWORD) {
                document.getElementById("admin-modal").style.display = "flex";
                fetchProducts();
            } else if (pass !== null) {
                alert("كلمة المرور غير صحيحة!");
            }
        };

        window.closeAdminPanel = function() {
            document.getElementById("admin-modal").style.display = "none";
            fetchProducts();
        };

        document.addEventListener("DOMContentLoaded", fetchProducts);
    </script>
</body>
</html>
